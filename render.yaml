services:
  # FastAPI Backend Web Service
  - type: web
    name: repo-chat-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MAX_FILES_PER_REPO
        value: "500"
      - key: CLONE_ROOT
        value: "/tmp/repo-chat-clones"
      - key: FRONTEND_ORIGIN
        value: "https://repo-chat-frontend.onrender.com"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: "meta/llama-3.2-11b-vision-instruct"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_API_KEY
        sync: false

  # React Frontend Static Site
  - type: web
    name: repo-chat-frontend
    env: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: repo-chat-backend
          property: url
